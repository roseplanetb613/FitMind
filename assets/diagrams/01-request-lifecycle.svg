<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" font-family="'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>FitMind 一次对话请求的全链路</title>
  <desc>用户消息经 HTTP 进入 agent.run 的图外前置处理，拼装 state_in 后进入 LangGraph 编排，出图后组装结构化结果，最后写入会话留档并返回响应。</desc>
  <rect x="0" y="0" width="680" height="580" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="120" y="40" width="440" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">用户消息</text>
  <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">POST /v1/chat · /v1/chat/stream</text>

  <rect x="120" y="156" width="440" height="56" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="175" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">agent.run · 图外前置</text>
  <text x="340" y="194" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">会话取建 · 记忆抽取写图谱 · 档案投影</text>

  <rect x="120" y="272" width="440" height="56" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="291" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">LangGraph 编排</text>
  <text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">guard → classify → 执行 → validate → render</text>

  <rect x="120" y="388" width="440" height="56" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="407" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">结构化结果</text>
  <text x="340" y="426" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">标题 · 数据或错误 · 来源标注 · 记忆确认</text>

  <rect x="120" y="504" width="440" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="523" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">会话留档 + 响应</text>
  <text x="340" y="542" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">history · last_structured · 整段或流式</text>

  <line x1="340" y1="100" x2="340" y2="151" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="356" y="126" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">message + session_id</text>

  <line x1="340" y1="216" x2="340" y2="267" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="356" y="242" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">state_in（含 history 与 last_structured）</text>

  <line x1="340" y1="332" x2="340" y2="383" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="356" y="358" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">reply + outcome / provenance</text>

  <line x1="340" y1="448" x2="340" y2="499" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="356" y="474" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">structured + memory_ack</text>
</svg>
