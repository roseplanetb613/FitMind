<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" role="img" font-family="'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>四种执行模式的形状与触发复杂度</title>
  <desc>simple 走 direct 单步；medium 走 react 的 think-act 循环；complex 走 plan_exec 的顺序编排；batch 走 rewoo 的四槽并行编排。后两者都在 aggregate 汇合。</desc>
  <rect x="0" y="0" width="680" height="396" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="58" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">direct</text>
  <text x="40" y="76" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">simple · 默认兜底</text>
  <rect x="200" y="40" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="253" y="62" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">execute</text>

  <text x="40" y="142" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">react</text>
  <text x="40" y="160" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">medium · 进度 / 教学</text>
  <rect x="200" y="124" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="253" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">think</text>
  <rect x="366" y="124" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="419" y="146" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">act</text>
  <line x1="310" y1="146" x2="362" y2="146" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M419 168 C419 200 253 200 253 172" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="442" y="196" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">未完成则再循环</text>

  <text x="40" y="226" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">plan_exec</text>
  <text x="40" y="244" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">complex · 训练计划</text>
  <rect x="200" y="208" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="253" y="230" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">plan_node</text>
  <rect x="366" y="208" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="419" y="230" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">逐步顺序执行</text>
  <rect x="532" y="208" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="585" y="230" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">aggregate</text>
  <line x1="310" y1="230" x2="362" y2="230" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="476" y1="230" x2="528" y2="230" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="40" y="310" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">rewoo</text>
  <text x="40" y="328" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">batch · 批量编排</text>
  <rect x="200" y="292" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="253" y="314" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">plan_node</text>
  <rect x="366" y="292" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="419" y="314" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">4 槽并行</text>
  <rect x="532" y="292" width="106" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="585" y="314" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">aggregate</text>
  <line x1="310" y1="314" x2="362" y2="314" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="476" y1="314" x2="528" y2="314" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
