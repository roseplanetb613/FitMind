<svg xmlns="http://www.w3.org/2000/svg" width="680" height="364" viewBox="0 0 680 364" role="img" font-family="'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>FitMind 的四层结构与单向依赖</title>
  <desc>呈现层 web 依赖编排层 app，编排层依赖消费层 lib，消费层依赖数据层 data。数据层包含 9 个数据集，消费层是纯只读的仓库层，编排层承载 Agent 编排与技能注册表。</desc>
  <rect x="0" y="0" width="680" height="364" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="600" height="304" rx="20" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>

  <rect x="60" y="60" width="560" height="54" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="76" y="87" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">呈现层 web/</text>
  <text x="190" y="78" text-anchor="start" dominant-baseline="central" font-size="12" fill="#534AB7">Vite + TypeScript + three.js（无 UI 框架）</text>
  <text x="190" y="97" text-anchor="start" dominant-baseline="central" font-size="12" fill="#534AB7">3D 肌群视图 · 对话面板 · 计划抽屉 · 建档 · 拍照上传</text>

  <line x1="340" y1="117" x2="340" y2="127" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="130" width="560" height="54" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="76" y="157" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">编排层 app/</text>
  <text x="190" y="148" text-anchor="start" dominant-baseline="central" font-size="12" fill="#534AB7">core（agent / graph / nodes / router）· skills · config</text>
  <text x="190" y="167" text-anchor="start" dominant-baseline="central" font-size="12" fill="#534AB7">rag · graph · runtime · storage · bus</text>

  <line x1="340" y1="187" x2="340" y2="197" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="200" width="560" height="54" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="76" y="227" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">消费层 lib/</text>
  <text x="190" y="218" text-anchor="start" dominant-baseline="central" font-size="12" fill="#534AB7">exercise_repo · foods_repo · dish_repo · muscle_map · parts</text>
  <text x="190" y="237" text-anchor="start" dominant-baseline="central" font-size="12" fill="#534AB7">progression · recovery · screening · split_cycle · …</text>

  <line x1="340" y1="257" x2="340" y2="267" stroke="#888780" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="270" width="560" height="54" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="76" y="297" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">数据层 data/</text>
  <text x="190" y="288" text-anchor="start" dominant-baseline="central" font-size="12" fill="#534AB7">exercises-dataset · nutrition-dataset · china-food</text>
  <text x="190" y="307" text-anchor="start" dominant-baseline="central" font-size="12" fill="#534AB7">dishes · training-science · sports-medicine · rag_eval · …</text>
</svg>
