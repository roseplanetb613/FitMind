<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>FitMind · 登录</title>
<style>
  /* 与主应用同一套暗色底（web/index.html 的 #0f1419）。这是进入应用前
     唯一可见的页面，风格不一致会让人怀疑连错了服务。 */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    /* ⚠ 垂直居中必须用 100vh：`min-height:100%` 在父级（html）高度未定时
       解析为 0，卡片会顶在页面上方（实测）。视口单位不依赖父级高度。 */
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #0f1419; color: #e6e6e6;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px;
    background: #161c22; border: 1px solid #2a333c; border-radius: 14px;
    padding: 26px 24px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 500; }
  .sub { margin: 0 0 20px; font-size: 12.5px; color: #8a949e; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 9px 0; border-radius: 8px; cursor: pointer;
    border: 1px solid #2a333c; background: transparent; color: #8a949e;
    font-size: 13.5px; font-family: inherit;
  }
  .tabs button.on { background: #12352b; border-color: #1d9e75; color: #9fe1cb; }
  label { display: block; margin: 12px 0 6px; font-size: 12.5px; color: #8a949e; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 9px;
    border: 1px solid #2a333c; background: #0f1419; color: #e6e6e6;
    font-size: 15px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #1d9e75; }
  button.go {
    width: 100%; margin-top: 18px; padding: 12px 0; border: none;
    border-radius: 9px; background: #1d9e75; color: #04241c;
    font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit;
  }
  button.go:disabled { opacity: .55; cursor: default; }
  .msg { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: #f09595; }
  .hint { margin-top: 14px; font-size: 11.5px; color: #5d6873; line-height: 1.6; }
</style>
</head>
<body>
  <main class="card">
    <h1>FitMind</h1>
    <p class="sub">同一账号，训练 / 饮食 / 计划 / 恢复都记在你名下。</p>

    <div class="tabs" role="tablist">
      <button id="t-login" class="on" type="button">登录</button>
      <button id="t-reg" type="button">注册</button>
    </div>

    <form id="form" autocomplete="off">
      <label for="u">用户名（小写字母 / 数字 / _ / -）</label>
      <input id="u" name="user_id" required maxlength="24" spellcheck="false"
             autocomplete="username" />
      <label for="p">密码（至少 6 位）</label>
      <input id="p" name="password" type="password" required minlength="6"
             autocomplete="current-password" />
      <button class="go" id="go" type="submit">登录</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>

    <p class="hint">
      只在局域网内可访问。注册即表示你知道：这台设备所在网络里的管理员
      可以看到服务器上的数据 —— 别填真实敏感信息当用户名。
    </p>
  </main>

<script>
  // 免构建页：不引任何模块。成功后带 user_id 跳进应用 ——
  // 应用各请求都会带 user_id，且服务端网关会把请求改写成登录者（双保险）。
  var mode = 'login';
  var $ = function (id) { return document.getElementById(id); };

  function setMode(m) {
    mode = m;
    $('t-login').classList.toggle('on', m === 'login');
    $('t-reg').classList.toggle('on', m === 'register');
    $('go').textContent = m === 'login' ? '登录' : '注册并进入';
    $('msg').textContent = '';
  }
  $('t-login').addEventListener('click', function () { setMode('login'); });
  $('t-reg').addEventListener('click', function () { setMode('register'); });

  // 已登录就不再看登录框（Cookie 30 天有效）
  fetch('/v1/auth/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (d && d.ok && d.user_id) location.replace('/app/?user_id=' + d.user_id);
    })
    .catch(function () {});

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var uid = $('u').value.trim().toLowerCase();
    var pw = $('p').value;
    var msg = $('msg');
    if (!uid || !pw) { msg.textContent = '用户名和密码都要填'; return; }
    $('go').disabled = true;
    msg.textContent = '';
    fetch('/v1/auth/' + mode, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: uid, password: pw })
    }).then(function (r) {
      return r.json().then(function (d) { return { status: r.status, body: d }; });
    }).then(function (res) {
      if (res.body && res.body.ok) {
        location.replace('/app/?user_id=' + res.body.user_id);
        return;
      }
      msg.textContent = (res.body && res.body.error) ||
                        ('请求失败（HTTP ' + res.status + '）');
      $('go').disabled = false;
    }).catch(function () {
      msg.textContent = '网络错误 —— 确认地址与端口没写错';
      $('go').disabled = false;
    });
  });
</script>
</body>
</html>
